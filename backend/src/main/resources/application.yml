server:
  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/aifomo
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  threads:
    browser-session:
      profile-directory: ./runtime/browser-profiles/threads
      chrome-executable: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      login-url: https://www.threads.net/
    browser-collector:
      headless: false
      max-scroll-count: 5
      max-posts-per-account: 20
      timeout: 20s
