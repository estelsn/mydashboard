server:
  port: 8080

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/aifomo
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  threads:
    browser-session:
      profile-directory: ./runtime/browser-profiles/threads
      chrome-executable: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      login-url: https://www.threads.net/
    browser-collector:
      headless: false
      max-scroll-count: 0
      max-posts-per-account: 3
      timeout: 20s
    collection:
      defaults:
        max-posts-per-account: 3
        max-scroll-count: 0
      limits:
        max-posts-per-account: 5
        max-scroll-count: 0
      safety:
        delay-between-accounts: 5s
        delay-between-scrolls: 3s
        min-source-recollection-interval: 60m
        stop-on-statuses:
          - ACCESS_RESTRICTED
          - LOGIN_REQUIRED
          - TIMEOUT
